<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Слон на воздушном шаре</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f1b33; }
  body { display: flex; align-items: center; justify-content: center; }
  svg { width: 100%; height: 100%; max-width: 1000px; max-height: 100vh; display: block; overflow: hidden; }

  .bob { animation: bob 5s ease-in-out infinite; transform-origin: 400px 250px; }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50%      { transform: translateY(-14px) rotate(1deg); }
  }
  .ear { animation: flap 2.6s ease-in-out infinite; transform-origin: 418px 380px; }
  @keyframes flap {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-9deg); }
  }
  .trunk { animation: wave 3s ease-in-out infinite; transform-origin: 468px 402px; }
  @keyframes wave {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(7deg); }
  }
  .flame { animation: flicker .5s ease-in-out infinite alternate; transform-origin: 400px 372px; }
  @keyframes flicker {
    from { transform: scale(1, 1); }
    to   { transform: scale(.85, 1.15); }
  }
  .cloud1 { animation: drift 40s linear infinite; }
  .cloud2 { animation: drift 55s linear infinite; animation-delay: -20s; }
  .cloud3 { animation: drift 70s linear infinite; animation-delay: -45s; }
  @keyframes drift {
    from { transform: translateX(-250px); }
    to   { transform: translateX(1050px); }
  }
  .bird { animation: flapbird .8s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
  @keyframes flapbird { from { transform: scaleY(1); } to { transform: scaleY(.35); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Слон летит на воздушном шаре</title>
  <desc id="d">Серый слон с поднятым хоботом стоит в плетёной корзине под полосатым воздушным шаром на фоне неба, облаков и холмов.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a7bd5"/>
      <stop offset=".6" stop-color="#8ec5f0"/>
      <stop offset="1" stop-color="#ffe3b3"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff7c2"/>
      <stop offset=".35" stop-color="#ffe56b"/>
      <stop offset="1" stop-color="#ffe56b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx=".38" cy=".3" r=".8">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a0a2a" stop-opacity=".38"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9b4c2"/>
      <stop offset="1" stop-color="#7d8999"/>
    </linearGradient>
    <linearGradient id="wicker" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98f4e"/>
      <stop offset="1" stop-color="#8e5a2b"/>
    </linearGradient>
    <linearGradient id="fl" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff8a00"/>
      <stop offset="1" stop-color="#fff3a0"/>
    </linearGradient>
    <clipPath id="balloonClip">
      <path d="M400 48 C528 48 566 158 524 240 C498 292 456 322 444 348 L356 348 C344 322 302 292 276 240 C234 158 272 48 400 48 Z"/>
    </clipPath>
    <pattern id="weave" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 7 H14 M7 0 V14" stroke="#6b3f1a" stroke-width="1.4" opacity=".55"/>
      <path d="M0 0 L14 14 M14 0 L0 14" stroke="#e0b078" stroke-width=".8" opacity=".35"/>
    </pattern>
  </defs>

  <!-- Небо -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="120" cy="110" r="110" fill="url(#sun)"/>
  <circle cx="120" cy="110" r="38" fill="#fff3a0"/>

  <!-- Далёкие облака -->
  <g class="cloud1" opacity=".9">
    <g fill="#fff"><ellipse cx="0" cy="130" rx="60" ry="20"/><ellipse cx="-30" cy="118" rx="34" ry="20"/><ellipse cx="22" cy="114" rx="40" ry="24"/></g>
  </g>
  <g class="cloud2" opacity=".8">
    <g fill="#fff"><ellipse cx="0" cy="300" rx="70" ry="20"/><ellipse cx="-34" cy="288" rx="36" ry="20"/><ellipse cx="26" cy="282" rx="44" ry="26"/></g>
  </g>
  <g class="cloud3" opacity=".7">
    <g fill="#fff"><ellipse cx="0" cy="60" rx="50" ry="14"/><ellipse cx="-20" cy="52" rx="26" ry="14"/><ellipse cx="18" cy="48" rx="30" ry="17"/></g>
  </g>

  <!-- Птицы -->
  <g fill="none" stroke="#2c3e55" stroke-width="2.4" stroke-linecap="round">
    <path class="bird" d="M640 150 q10 -12 20 0 q10 -12 20 0"/>
    <path class="bird" style="animation-delay:-.3s" d="M690 190 q8 -9 16 0 q8 -9 16 0"/>
    <path class="bird" style="animation-delay:-.55s" d="M110 250 q7 -8 14 0 q7 -8 14 0"/>
  </g>

  <!-- Холмы далеко внизу -->
  <path d="M0 540 C100 505 200 520 300 535 C420 495 540 515 640 530 C710 510 760 520 800 530 V600 H0 Z" fill="#8fc98f"/>
  <path d="M0 570 C120 545 230 565 340 572 C460 545 600 560 800 570 V600 H0 Z" fill="#5fa86a"/>
  <path d="M0 592 C200 578 420 590 800 584 V600 H0 Z" fill="#3f8a55"/>
  <g fill="#d96c5b">
    <rect x="560" y="530" width="14" height="9"/><path d="M557 530 l10 -8 l10 8 Z" fill="#8c3a2e"/>
  </g>

  <!-- Шар, корзина и слон (качаются вместе) -->
  <g class="bob">

    <!-- Шар -->
    <g>
      <g clip-path="url(#balloonClip)">
        <rect x="200" y="30" width="400" height="340" fill="#e63946"/>
        <ellipse cx="400" cy="200" rx="128" ry="170" fill="#ffd166"/>
        <ellipse cx="400" cy="200" rx="92"  ry="170" fill="#e63946"/>
        <ellipse cx="400" cy="200" rx="58"  ry="170" fill="#2a9d8f"/>
        <ellipse cx="400" cy="200" rx="26"  ry="170" fill="#ffd166"/>
        <path d="M282 238 C330 262 470 262 518 238 L534 258 C480 300 320 300 266 258 Z" fill="#264653" opacity=".92"/>
        <path d="M290 252 C340 275 460 275 510 252" fill="none" stroke="#ffd166" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
        <rect x="200" y="30" width="400" height="340" fill="url(#shade)"/>
      </g>
      <path d="M400 48 C528 48 566 158 524 240 C498 292 456 322 444 348 L356 348 C344 322 302 292 276 240 C234 158 272 48 400 48 Z" fill="none" stroke="#7a1b24" stroke-width="2" opacity=".6"/>
      <ellipse cx="350" cy="110" rx="30" ry="46" fill="#fff" opacity=".25" transform="rotate(25 350 110)"/>
      <path d="M356 348 L444 348 L438 360 L362 360 Z" fill="#3b2a1a"/>
    </g>

    <!-- Верёвки -->
    <g stroke="#4a3320" stroke-width="2.6" stroke-linecap="round">
      <path d="M362 360 L326 486"/>
      <path d="M438 360 L474 486"/>
      <path d="M380 360 L368 486" opacity=".8"/>
      <path d="M420 360 L432 486" opacity=".8"/>
    </g>

    <!-- Горелка и пламя -->
    <g>
      <rect x="392" y="360" width="16" height="10" rx="2" fill="#555"/>
      <g class="flame">
        <path d="M400 392 C386 380 394 372 400 362 C406 372 414 380 400 392 Z" fill="url(#fl)"/>
        <path d="M400 388 C394 382 397 377 400 372 C403 377 406 382 400 388 Z" fill="#fff8d0"/>
      </g>
    </g>

    <!-- Слон -->
    <g transform="translate(0 23) translate(400 440) scale(1.2) translate(-400 -440)">
      <!-- туловище и хвост -->
      <ellipse cx="386" cy="440" rx="62" ry="46" fill="url(#skin)"/>
      <path d="M326 440 C312 446 308 462 316 472" fill="none" stroke="#7d8999" stroke-width="5" stroke-linecap="round"/>
      <path d="M312 470 l-5 8 M316 472 l0 9 M320 470 l5 7" stroke="#4d5766" stroke-width="3" stroke-linecap="round"/>
      <!-- дальнее ухо -->
      <ellipse cx="440" cy="378" rx="22" ry="28" fill="#8d98a8"/>

      <!-- голова -->
      <ellipse cx="438" cy="400" rx="36" ry="34" fill="url(#skin)"/>
      <ellipse cx="430" cy="388" rx="14" ry="9" fill="#c4ccd6" opacity=".45"/>

      <!-- хобот -->
      <g class="trunk">
        <path d="M468 400 C496 402 508 428 498 448 C493 458 482 456 484 446" fill="none" stroke="#7d8999" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M468 400 C496 402 508 428 498 448 C493 458 482 456 484 446" fill="none" stroke="#a9b4c2" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity=".6"/>
        <path d="M480 408 q6 2 10 8 M486 424 q6 3 7 10" fill="none" stroke="#5f6a79" stroke-width="1.8" stroke-linecap="round"/>
      </g>

      <!-- бивень -->
      <path d="M460 420 C474 424 484 418 488 406 C478 410 470 410 458 410 Z" fill="#fffaf0" stroke="#d9cfb8" stroke-width="1"/>

      <!-- глаз -->
      <circle cx="450" cy="392" r="5.2" fill="#fff"/>
      <circle cx="451.5" cy="392.5" r="3.2" fill="#1b1b24"/>
      <circle cx="452.6" cy="391.3" r="1.1" fill="#fff"/>
      <path d="M443 384 q7 -6 14 -1" fill="none" stroke="#5f6a79" stroke-width="2" stroke-linecap="round"/>
      <!-- румянец -->
      <ellipse cx="452" cy="408" rx="6" ry="3.4" fill="#ff9aa8" opacity=".6"/>
      <!-- улыбка -->
      <path d="M458 414 q4 3 8 0" fill="none" stroke="#4d5766" stroke-width="1.8" stroke-linecap="round"/>

      <!-- ближнее ухо -->
      <g class="ear">
        <path d="M420 366 C384 350 366 384 376 416 C384 440 416 440 424 412 C430 392 430 378 420 366 Z" fill="#9aa5b4"/>
        <path d="M418 376 C394 366 384 388 390 408 C396 424 414 424 418 408 C421 396 422 386 418 376 Z" fill="#f1a9b6" opacity=".85"/>
      </g>

      <!-- шарф -->
      <path d="M404 424 C420 434 446 434 462 424 L460 436 C444 446 420 446 406 436 Z" fill="#e63946"/>
      <path d="M404 424 C420 434 446 434 462 424" fill="none" stroke="#ffd166" stroke-width="2" stroke-dasharray="3 5"/>
      <path d="M404 432 C380 436 372 428 356 438 C372 450 392 446 408 440 Z" fill="#e63946"/>
      <path d="M356 438 l-8 4 l4 -9 Z" fill="#ffd166"/>
    </g>

    <!-- Корзина (передний борт) -->
    <g transform="translate(0 50)">
      <path d="M318 436 L482 436 L470 508 Q400 524 330 508 Z" fill="url(#wicker)"/>
      <path d="M318 436 L482 436 L470 508 Q400 524 330 508 Z" fill="url(#weave)"/>
      <rect x="312" y="428" width="176" height="14" rx="7" fill="#a06a35"/>
      <rect x="312" y="428" width="176" height="5" rx="2.5" fill="#d9a56a" opacity=".7"/>
      <path d="M326 480 Q400 494 474 480" fill="none" stroke="#5e3716" stroke-width="3" opacity=".7"/>
      <path d="M400 474 C386 464 390 454 396 454 C399 454 400 457 400 458 C400 457 401 454 404 454 C410 454 414 464 400 474 Z" fill="#e63946" stroke="#ffd166" stroke-width="1.6" stroke-linejoin="round"/>
    </g>

    <!-- Мешки с балластом -->
    <g transform="translate(0 50)">
      <path d="M300 440 q-8 14 0 26 q10 6 20 0 q6 -12 0 -26 Z" fill="#b08968"/>
      <path d="M302 442 q8 -6 16 0" fill="none" stroke="#6b4a2e" stroke-width="2"/>
      <path d="M500 440 q8 14 0 26 q-10 6 -20 0 q-6 -12 0 -26 Z" fill="#b08968"/>
      <path d="M498 442 q-8 -6 -16 0" fill="none" stroke="#6b4a2e" stroke-width="2"/>
    </g>
  </g>
</svg>
</body>
</html>
