<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Слон на воздушном шаре</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: #e9f5ff;
    }
    svg {
      display: block;
      width: 100%;
      max-width: 800px;
      height: auto;
    }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
    <title id="title">Слон летит на воздушном шаре</title>
    <desc id="desc">Серый слон в плетёной корзине под полосатым воздушным шаром, поднимает хобот.</desc>

    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#5fb8ee"/>
        <stop offset="1" stop-color="#d9f1ff"/>
      </linearGradient>
      <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity="0.22"/>
      </linearGradient>
      <clipPath id="envelope">
        <path d="M400,30 C540,30 590,120 582,190 C574,275 480,345 400,345 C320,345 226,275 218,190 C210,120 260,30 400,30 Z"/>
      </clipPath>
    </defs>

    <!-- Небо и солнце -->
    <rect width="800" height="600" fill="url(#sky)"/>
    <circle cx="680" cy="110" r="78" fill="#ffffff" opacity="0.25"/>
    <circle cx="680" cy="110" r="46" fill="#fff3a1"/>

    <!-- Облака -->
    <g fill="#ffffff" opacity="0.95">
      <ellipse cx="140" cy="164" rx="74" ry="22"/>
      <circle cx="112" cy="152" r="26"/>
      <circle cx="146" cy="136" r="36"/>
      <circle cx="180" cy="154" r="24"/>
    </g>
    <g fill="#ffffff" opacity="0.95">
      <ellipse cx="655" cy="304" rx="60" ry="18"/>
      <circle cx="632" cy="294" r="20"/>
      <circle cx="662" cy="282" r="26"/>
      <circle cx="688" cy="296" r="18"/>
    </g>
    <g fill="#ffffff" opacity="0.9">
      <ellipse cx="80" cy="330" rx="46" ry="14"/>
      <circle cx="64" cy="322" r="16"/>
      <circle cx="90" cy="314" r="20"/>
    </g>

    <!-- Птицы -->
    <g fill="none" stroke="#2c3e50" stroke-width="3" stroke-linecap="round">
      <path d="M590,84 q9,-9 18,0 q9,-9 18,0"/>
      <path d="M628,58 q6,-6 12,0 q6,-6 12,0"/>
    </g>

    <!-- Холмы внизу -->
    <path d="M0,515 Q150,462 320,500 T640,492 T800,472 V600 H0 Z" fill="#9ad88f"/>
    <path d="M0,562 Q210,520 430,556 T800,540 V600 H0 Z" fill="#6cbf68"/>

    <!-- Флажок на макушке -->
    <line x1="400" y1="30" x2="400" y2="4" stroke="#3b2a20" stroke-width="2.5"/>
    <path d="M400,4 L426,12 L400,20 Z" fill="#e4572e"/>

    <!-- Воздушный шар: полосатые сегменты, обрезанные силуэтом -->
    <g clip-path="url(#envelope)">
      <path d="M400,30 C260,30 210,120 218,190 C226,275 320,345 400,345 Q218,188 400,30 Z" fill="#e4572e"/>
      <path d="M400,30 Q218,188 400,345 Q400,188 400,30 Z" fill="#ffd166"/>
      <path d="M400,30 Q400,188 400,345 Q582,188 400,30 Z" fill="#e4572e"/>
      <path d="M400,30 Q582,188 400,345 C480,345 574,275 582,190 C590,120 540,30 400,30 Z" fill="#ffd166"/>
      <rect x="200" y="0" width="400" height="360" fill="url(#shade)"/>
      <ellipse cx="292" cy="118" rx="14" ry="52" transform="rotate(-18 292 118)" fill="#ffffff" opacity="0.35"/>
    </g>
    <path d="M400,30 C540,30 590,120 582,190 C574,275 480,345 400,345 C320,345 226,275 218,190 C210,120 260,30 400,30 Z" fill="none" stroke="#3b2a20" stroke-width="3" stroke-linejoin="round"/>

    <!-- Горловина шара -->
    <rect x="360" y="339" width="80" height="15" rx="4" fill="#5b4232"/>

    <!-- Стропы -->
    <g stroke="#5b4232" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M364,352 L318,492"/>
      <path d="M436,352 L482,492"/>
      <path d="M384,352 L346,492"/>
      <path d="M416,352 L454,492"/>
    </g>

    <!-- Слон -->
    <!-- Хвост -->
    <path d="M302,424 C286,436 284,456 290,470" fill="none" stroke="#8c96a0" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="290" cy="474" rx="6" ry="8" fill="#5f6a74"/>
    <!-- Задние ноги -->
    <rect x="330" y="440" width="22" height="56" rx="11" fill="#6f7a84"/>
    <rect x="358" y="440" width="22" height="56" rx="11" fill="#6f7a84"/>
    <!-- Туловище -->
    <ellipse cx="400" cy="440" rx="100" ry="48" fill="#a4aeb8"/>
    <ellipse cx="400" cy="470" rx="84" ry="12" fill="#8c96a0" opacity="0.6"/>
    <g fill="none" stroke="#7b8590" stroke-width="2" stroke-linecap="round" opacity="0.6">
      <path d="M372,424 q8,8 0,18"/>
      <path d="M388,420 q8,8 0,18"/>
    </g>
    <!-- Передние ноги -->
    <rect x="430" y="448" width="22" height="56" rx="11" fill="#8c96a0"/>
    <rect x="462" y="448" width="22" height="56" rx="11" fill="#8c96a0"/>
    <!-- Голова -->
    <ellipse cx="492" cy="402" rx="50" ry="52" fill="#a4aeb8"/>
    <!-- Ухо -->
    <ellipse cx="458" cy="404" rx="30" ry="44" transform="rotate(14 458 404)" fill="#8c96a0" stroke="#6f7984" stroke-width="2"/>
    <ellipse cx="460" cy="406" rx="16" ry="30" transform="rotate(14 460 406)" fill="#e8a3a3" opacity="0.7"/>
    <!-- Глаз -->
    <circle cx="514" cy="392" r="6" fill="#1f2a33"/>
    <circle cx="516" cy="390" r="2" fill="#ffffff"/>
    <!-- Хобот, поднятый в приветствии -->
    <path d="M530,424 C572,430 594,406 588,380 C584,362 566,360 566,374" fill="none" stroke="#949eaa" stroke-width="20" stroke-linecap="round"/>
    <path d="M580,392 q-4,5 0,11" fill="none" stroke="#6f7a84" stroke-width="2" stroke-linecap="round"/>
    <!-- Бивень -->
    <path d="M526,428 Q546,436 542,458 Q534,446 520,444 Z" fill="#fff7e0" stroke="#cdbf96" stroke-width="1.2"/>

    <!-- Плетёная корзина -->
    <path d="M318,490 H482 L468,570 H332 Z" fill="#b5793f" stroke="#5c3a1c" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#7a4e24" stroke-width="2" fill="none" opacity="0.8">
      <path d="M322,512 H478"/>
      <path d="M327,532 H473"/>
      <path d="M332,552 H468"/>
      <path d="M352,490 L346,570"/>
      <path d="M400,490 V570"/>
      <path d="M448,490 L454,570"/>
    </g>
    <rect x="312" y="486" width="176" height="16" rx="6" fill="#8e5b2e" stroke="#5c3a1c" stroke-width="2.5"/>

    <!-- Ветер -->
    <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85">
      <path d="M130,470 h50"/>
      <path d="M160,500 h80"/>
      <path d="M185,530 h60"/>
      <path d="M520,520 h90"/>
      <path d="M548,552 h56"/>
    </g>
  </svg>
</body>
</html>
