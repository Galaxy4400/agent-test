<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Слон на воздушном шаре</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #f4efe6;
  }
  @media (prefers-color-scheme: dark) { body { background: #151a2b; } }
  .frame {
    width: min(96vw, calc(96vh * 0.8));
    aspect-ratio: 4 / 5;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 18px 50px rgba(20, 30, 60, .25);
  }
  svg { display: block; width: 100%; height: 100%; }

  .bob      { transform-origin: 400px 575px; animation: bob 7s ease-in-out infinite; }
  .bob-far  { animation: bobFar 9s ease-in-out infinite; }
  .drift-a  { animation: driftA 20s ease-in-out infinite alternate; }
  .drift-b  { animation: driftB 26s ease-in-out infinite alternate; }
  .flame    { transform-origin: 400px 598px; animation: flicker .45s ease-in-out infinite alternate; }
  .glow     { animation: glow .45s ease-in-out infinite alternate; }
  .ear-l    { transform-origin: 352px 682px; animation: flapL 2.6s ease-in-out infinite; }
  .ear-r    { transform-origin: 448px 682px; animation: flapR 2.6s ease-in-out infinite; }
  .scarf    { transform-origin: 338px 730px; animation: flutter 1.1s ease-in-out infinite alternate; }
  .trunk    { transform-origin: 402px 690px; animation: wave 4s ease-in-out infinite; }
  .bird     { transform-origin: 540px 582px; animation: hop 3.2s ease-in-out infinite; }

  @keyframes bob     { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-12px) rotate(-.8deg); } }
  @keyframes bobFar  { 0%,100% { transform: translate(0,0); } 50% { transform: translate(6px,-8px); } }
  @keyframes driftA  { to { transform: translateX(28px); } }
  @keyframes driftB  { to { transform: translateX(-24px); } }
  @keyframes flicker { from { transform: scale(1, .86); } to { transform: scale(1.06, 1.08); } }
  @keyframes glow    { from { opacity: .55; } to { opacity: 1; } }
  @keyframes flapL   { 0%,100% { transform: none; } 50% { transform: rotate(5deg) scaleX(.9); } }
  @keyframes flapR   { 0%,100% { transform: none; } 50% { transform: rotate(-5deg) scaleX(.9); } }
  @keyframes flutter { from { transform: rotate(-3deg); } to { transform: rotate(4deg) skewX(-4deg); } }
  @keyframes wave    { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-3deg); } }
  @keyframes hop     { 0%,70%,86%,100% { transform: none; } 78% { transform: translateY(-6px); } }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div class="frame">
